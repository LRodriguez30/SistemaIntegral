<div class="grid min-h-screen place-items-center bg-zinc-50 px-6">

  <div class="w-full max-w-2xl text-center">

    <!-- 404 -->

    <div
      class="
        mx-auto
        mb-8
        flex
        h-20
        w-20
        items-center
        justify-center
        rounded-3xl
        bg-black
        text-white
        shadow-lg
      "
    >
      <span class="text-2xl font-black">
        404
      </span>
    </div>


    <!-- TEXTO -->

    <p
      class="
        text-sm
        font-bold
        uppercase
        tracking-[0.35em]
        text-zinc-500
      "
    >
      Página no encontrada
    </p>


    <h1
      class="
        mt-4
        text-5xl
        font-black
        tracking-tight
        text-zinc-950
        lg:text-6xl
      "
    >
      Parece que te perdiste...
    </h1>


    <p
      class="
        mx-auto
        mt-6
        max-w-xl
        text-lg
        leading-relaxed
        text-zinc-600
      "
    >
      La página que intentas visitar no existe, fue movida o la dirección
      que utilizaste ya no está disponible.
    </p>


    <!-- ACCIONES -->

    <div
      class="
        mt-10
        flex
        flex-col
        justify-center
        gap-3
        sm:flex-row
      "
    >

      <!-- VOLVER -->

      <button
        type="button"
        (click)="goBack()"
        class="
          inline-flex
          cursor-pointer
          items-center
          justify-center
          gap-2
          rounded-2xl
          bg-black
          px-7
          py-4
          text-sm
          font-semibold
          text-white
          shadow-sm
          transition-all
          duration-200
          hover:bg-zinc-800
        "
      >

        <iconify-icon
          icon="lucide:arrow-left"
          class="text-[17px]"
        ></iconify-icon>

        Volver
      </button>


      <!-- INICIO -->

      <button
        type="button"
        (click)="goHome()"
        class="
          inline-flex
          cursor-pointer
          items-center
          justify-center
          gap-2
          rounded-2xl
          border
          border-zinc-300
          bg-white
          px-7
          py-4
          text-sm
          font-semibold
          text-zinc-900
          transition-all
          duration-200
          hover:bg-zinc-100
        "
      >

        <iconify-icon
          icon="lucide:house"
          class="text-[17px]"
        ></iconify-icon>

        Inicio
      </button>


      <!-- CATÁLOGO -->

      <button
        type="button"
        (click)="goCatalog()"
        class="
          inline-flex
          cursor-pointer
          items-center
          justify-center
          gap-2
          rounded-2xl
          border
          border-zinc-300
          bg-white
          px-7
          py-4
          text-sm
          font-semibold
          text-zinc-900
          transition-all
          duration-200
          hover:bg-zinc-100
        "
      >

        <iconify-icon
          icon="lucide:shopping-bag"
          class="text-[17px]"
        ></iconify-icon>

        Ver catálogo
      </button>

    </div>

  </div>

</div>
