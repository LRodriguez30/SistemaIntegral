<div class="grid min-h-screen place-items-center px-6 bg-zinc-50">
  <div class="w-full max-w-2xl text-center">

    <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-black text-white mb-8 shadow-lg">
      <span class="text-2xl font-black">404</span>
    </div>

    <p class="text-sm uppercase tracking-[0.35em] text-zinc-500 font-bold">
      Página no encontrada
    </p>

    <h1 class="text-5xl lg:text-6xl font-black tracking-tight text-zinc-950 mt-4">
      Parece que te perdiste...
    </h1>

    <p class="max-w-xl mx-auto text-zinc-600 mt-6 text-lg leading-relaxed">
      La página que intentas visitar no existe, fue movida o la dirección
      que utilizaste ya no está disponible.
    </p>

    <div class="mt-10 flex flex-col sm:flex-row justify-center gap-3">

      <button type="button" (click)="goHome()"
        class="cursor-pointer inline-flex items-center justify-center bg-black text-white px-7 py-4 rounded-2xl text-sm font-semibold hover:bg-zinc-800 transition-all duration-200 shadow-sm">
        Volver al inicio
      </button>

      <button type="button" (click)="goCatalog()"
        class="cursor-pointer inline-flex items-center justify-center border border-zinc-300 bg-white px-7 py-4 rounded-2xl text-sm font-semibold text-zinc-900 hover:bg-zinc-100 transition-all duration-200">
        Ver catálogo
      </button>

    </div>

  </div>
</div>
