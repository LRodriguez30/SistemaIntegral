<div class="relative min-h-screen transition-all duration-500 ease-in-out"
  [class.opacity-0]="navigating"
  [class.scale-95]="navigating">

  <!-- LOADER OVERLAY (NO BLOQUEANTE) -->
  <div
    class="fixed inset-0 flex items-center justify-center bg-[#09090b]/70 backdrop-blur-md z-50
           transition-all duration-500 ease-in-out pointer-events-none"
    [class.opacity-0]="!loader.loading()"
    [class.opacity-100]="loader.loading()"
    [class.scale-95]="!loader.loading()"
    [class.scale-100]="loader.loading()"
  >
    <div class="flex flex-col items-center gap-4">

      <img
        ngSrc="assets/unicolab.png"
        width="60"
        height="60"
        class="animate-pulse opacity-80"
      />

      <div class="w-7 h-7 border-2 border-[#27272a] border-t-[#f97316] rounded-full animate-spin"></div>

      <p class="text-sm text-[#a1a1aa]">
        {{ loader.message() || 'Cargando...' }}
      </p>

    </div>
  </div>

  <!-- CONTENIDO AUTH -->
  <router-outlet></router-outlet>

</div>
